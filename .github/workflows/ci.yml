name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      # The build the mod is tested on; mods are in early access and their API can change between releases.
      CLAUDE_CODE_VERSION: 2.1.318
      DISABLE_AUTOUPDATER: 1
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm install -g "@anthropic-ai/claude-code@${CLAUDE_CODE_VERSION}"
      - run: claude plugin validate . --strict
      - run: claude plugin test .
      # The Paseo plugin shares paseo/shared with the mod, so a change on either side is checked on both.
      - run: npm ci
        working-directory: paseo
      - run: npm run typecheck
        working-directory: paseo
      - run: npm test
        working-directory: paseo
